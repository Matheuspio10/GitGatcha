name: Database backup

# Daily encrypted dump of the production database, kept 30 days as a workflow
# artifact. The repository is public: the dump (e-mails, password hashes) is
# encrypted with age BEFORE it touches the disk, and only the owner holds the
# private key. Setup and restore: docs/backup.md

on:
  schedule:
    - cron: '30 6 * * *' # 06:30 UTC, after the 06:00 fallback-pool cron
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "::error::Set the BACKUP_DATABASE_URL secret and the BACKUP_AGE_RECIPIENT variable (see docs/backup.md)"
            exit 1
          fi

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump, compress and encrypt
        id: dump
        run: |
          set -euo pipefail
          # pg_dump through Neon's direct endpoint, not the pgbouncer pooler
          export DATABASE_URL="${BACKUP_DATABASE_URL/-pooler./.}"
          file="gitgacha-$(date -u +%Y-%m-%dT%H%MZ).sql.gz.age"
          docker run --rm -e DATABASE_URL postgres:18-alpine \
            sh -c 'pg_dump --no-owner --no-privileges "$DATABASE_URL"' \
            | gzip -9 \
            | age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" > "$file"
          test -s "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -lh "$file"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.file }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0 # already compressed and encrypted
